<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        body {
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #ff4081;
        }
        p {
            color: #333;
            font-size: 18px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Happy Birthday! 🎉</h1>
        <p>Wishing you a wonderful day filled with love and joy!</p>
    </div>

</body>
</html>
